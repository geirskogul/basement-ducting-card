<!doctype html>
<!-- Replay test with a mock Home Assistant that serves two hours of made-up history: open with
     chromium --headless=new --no-sandbox --allow-file-access-from-files --virtual-time-budget=4000 --dump-dom "file://$PWD/tools/replay-test.html" | grep -o '<title>[^<]*</title>' -->
<html><head><meta charset="utf-8"><style>body{margin:0;background:#f5f5f5;width:430px}</style></head><body>
<script>
// Headless Chromium under --virtual-time-budget delivers almost no animation frames; a timer-driven stand-in keeps
// the card's playback and colour easing running in virtual time (real browsers use the real one).
window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
</script>
<script type="module">
import "../basement-ducting-card.js";
const S = (v) => ({ state: String(v), attributes: { unit_of_measurement: "°C" } });
const end = Date.now(), start = end - 2 * 3600e3;
// Units alternate every 8 minutes: left exhausts while right takes air in, then the other way round.
function history(ids) {
  const out = {};
  for (const e of ids) out[e] = [];
  for (let t = start - 600e3, i = 0; t <= end; t += 60e3, i++) {
    const leftEx = Math.floor(i / 8) % 2 === 0, sec = t / 1000;
    const push = (e, s) => out[e] && out[e].push({ s: String(s), lu: sec });
    push("sensor.l_phase", leftEx ? "exhaust" : "intake"); push("sensor.r_phase", leftEx ? "intake" : "exhaust");
    push("sensor.l_in", leftEx ? 34 : 16); push("sensor.r_in", leftEx ? 18 : 40 + Math.floor(i / 16));
    push("sensor.l_out", leftEx ? 20 : 8); push("sensor.r_out", leftEx ? 9 : 31);
    push("sensor.heater_in", 25 + (i % 10) / 10);
  }
  return out;
}
const hass = {
  states: { "sensor.l_in": S(30), "sensor.l_out": S(10), "sensor.l_phase": { state: "exhaust", attributes: {} },
            "sensor.r_in": S(40), "sensor.r_out": S(30), "sensor.r_phase": { state: "intake", attributes: {} }, "sensor.heater_in": S(25) },
  config: { unit_system: { temperature: "°C" } },
  callWS: async (msg) => { window.lastWS = msg; return history(msg.entity_ids); },
};
const c = document.createElement("basement-ducting-card");
c.setConfig({ left: { inside: "sensor.l_in", outside: "sensor.l_out", phase: "sensor.l_phase" },
              right: { inside: "sensor.r_in", outside: "sensor.r_out", phase: "sensor.r_phase" }, heater_intake: "sensor.heater_in", replay_hours: 2 });
c.hass = hass; document.body.appendChild(c);
const r = c.shadowRoot, q = (s) => r.querySelector(".replay ." + s), el = (k) => r.querySelector(`[id^="${k}-bd"]`);
const out = [];
q("open").click();
out.push("panel " + (q("panel").hidden ? "hidden" : "open") + " from=" + (q("from").value ? "set" : "empty"));
q("load").click();
setTimeout(async () => {
  out.push("ws=" + window.lastWS.type + " ids=" + window.lastWS.entity_ids.length);
  out.push("player " + (q("player").hidden ? "hidden" : "shown") + " playing=" + q("play").textContent);
  out.push("sub=" + el("t-sub").textContent.split(" · ")[0]);
  q("play").click(); // pause
  const pos = q("pos");
  pos.value = "100"; pos.dispatchEvent(new Event("input"));
  const a = [el("t-l-in").textContent, el("t-r-in").textContent, el("a-ex-l").classList.contains("idle") ? "L idle" : "L exhaust"];
  pos.value = "170"; pos.dispatchEvent(new Event("input"));
  const b = [el("t-l-in").textContent, el("t-r-in").textContent, el("a-ex-l").classList.contains("idle") ? "L idle" : "L exhaust"];
  out.push("at 10%: " + a.join(",") + " | at 17%: " + b.join(","));
  // The hood (no sensor): fades between cycle peaks inside a cycle; the last, unfinished cycle holds.
  const hoods = [];
  for (const v of ["300", "330", "360", "390", "990", "1000"]) { pos.value = v; pos.dispatchEvent(new Event("input")); hoods.push(el("t-hood").textContent); }
  out.push("hood along the timeline: " + hoods.join(", "));
  // No jumps: sweep the timeline in small steps and find the biggest colour step of the hoses and the hood.
  const rgb = (c) => c.match(/\d+/g).map(Number);
  const colourOf = (key, i) => rgb(getComputedStyle(r.querySelector(`[id^="${key}-bd"]`).querySelectorAll("stop")[i]).stopColor);
  const worst = { "g-hose-l": 0, "g-hose-r": 0, "g-hood": 0 };
  let prev = null;
  for (let v = 120; v <= 980; v += 2) {
    pos.value = String(v); pos.dispatchEvent(new Event("input"));
    const now = Object.fromEntries(Object.keys(worst).map((k) => [k, [colourOf(k, 0), colourOf(k, 11)]]));
    if (prev) for (const k of Object.keys(worst)) for (const e of [0, 1])
      worst[k] = Math.max(worst[k], ...now[k][e].map((x, j) => Math.abs(x - prev[k][e][j])));
    prev = now;
  }
  out.push("largest colour step: " + Object.entries(worst).map(([k, v]) => `${k} ${v}`).join(", "));
  // Arrows: the right sets are showing, pointing the way the air moves.
  const groups = [...r.querySelectorAll("g[id*='-f-bd'], g[id*='-r-bd']")].filter((e) => e.style.display !== "none").map((e) => e.id.replace(/-bd\d+$/, ""));
  out.push("arrows shown: " + groups.join(","));
  hass.states["sensor.l_in"] = S(99); c.hass = { ...hass }; // a live update during replay must not show
  out.push("live ignored: " + (el("t-l-in").textContent !== "99.0 °C"));
  hass.states["sensor.l_in"] = S(30); // back to a normal reading before going live
  // Playing at the fastest speed, no part may change colour in a jump between frames.
  q("speed").value = "1800"; pos.value = "0"; pos.dispatchEvent(new Event("input"));
  await new Promise((ok) => setTimeout(ok, 1500));
  const all = [...r.querySelectorAll("linearGradient[id^='g-']")];
  const grab = () => all.map((g) => [...g.querySelectorAll("stop")].map((x) => rgb(getComputedStyle(x).stopColor)));
  let before = grab(), jump = 0, where = "";
  q("play").click();
  for (let f = 0; f < 150; f++) {
    await new Promise((ok) => setTimeout(ok, 16));
    const now = grab();
    now.forEach((g, gi) => g.forEach((c, si) => c.forEach((x, j) => {
      const d = Math.abs(x - before[gi][si][j]);
      if (d > jump) { jump = d; where = all[gi].id.replace(/-bd\d+$/, ""); }
    })));
    before = now;
  }
  q("play").click();
  out.push(`playing at 1800x: largest colour step between frames ${jump} (${where})`);
  // Eased colours settle on the readings once the timeline stops.
  pos.value = "500"; pos.dispatchEvent(new Event("input"));
  await new Promise((ok) => setTimeout(ok, 4000));
  const settled = JSON.stringify(c._shown) === JSON.stringify(c._target);
  out.push("eased colours settled: " + settled);
  q("open").click(); // back to live
  out.push("back live: sub='" + el("t-sub").textContent + "' l_in=" + el("t-l-in").textContent + " panel " + (q("panel").hidden ? "hidden" : "open"));
  setTimeout(() => {
    // Live: the hood holds the last complete cycle's peak (seeded from history), then moves on when a cycle ends.
    const seeded = el("t-hood").textContent;
    const set = (lp, rp, l, r) => {
      hass.states = { ...hass.states, "sensor.l_phase": { state: lp, attributes: {} }, "sensor.r_phase": { state: rp, attributes: {} },
                      "sensor.l_in": S(l), "sensor.r_in": S(r) };
      c.hass = { ...hass };
    };
    set("intake", "exhaust", 16, 55);   // the cycle under way peaks at 55 ...
    const during = el("t-hood").textContent;
    set("exhaust", "intake", 30, 18);   // ... and ends: a new cycle starts
    out.push(`live: seeded ${seeded}, during ${during}, next cycle ${el("t-hood").textContent}`);
    document.title = out.join(" || ");
  }, 300);
}, 500);
</script></body></html>
